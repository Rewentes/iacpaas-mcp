name: iacpaas

services:
  web:
    image: iacpaas-web:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    command:
      - iacpaas-web
      - --env-file
      - /run/secrets/app_env
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --db
      - /data/chat.sqlite3
    environment:
      MCP_TRANSPORT: stdio
    ports:
      - "${IACPAAS_BIND_ADDRESS:-127.0.0.1}:${IACPAAS_WEB_PORT:-8080}:8080"
    volumes:
      - app_data:/data
    secrets:
      - app_env
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s

volumes:
  app_data:

secrets:
  app_env:
    file: .env
