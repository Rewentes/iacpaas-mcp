name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private env file for the compose secret
        run: cp .env.example .env
      - name: Build and start the web chat
        run: docker compose --env-file /dev/null up -d --build
      - name: Wait for /healthz
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file /dev/null logs
          exit 1
      - name: Check the web chat session endpoint
        run: curl -fsS http://127.0.0.1:8080/api/me
      - name: Stop the web chat
        if: always()
        run: docker compose --env-file /dev/null down -v
