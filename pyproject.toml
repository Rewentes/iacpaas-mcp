[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "iacpaas-mcp"
version = "0.1.0"
description = "MCP-сервер и агентские клиенты для графовых ресурсов IACPaaS"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "python-dotenv==1.2.0",
]

[project.scripts]
iacpaas-mcp = "iacpaas_mcp.server:main"
iacpaas-agent = "standalone_agent.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/iacpaas_mcp", "src/standalone_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
